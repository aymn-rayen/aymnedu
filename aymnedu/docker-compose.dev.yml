# Docker Compose for LOCAL DEVELOPMENT (Hot-Reloading & Debugging)
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  db:
    image: postgres:16-alpine
    container_name: aymnedu_dev_db
    environment:
      POSTGRES_USER: aymnedu
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: aymnedu
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aymnedu"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aymnedu_dev_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aymnedu_dev_backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://aymnedu:changeme@db:5432/aymnedu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-insecure-secret-key-at-least-32-chars-long
      DEBUG: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aymnedu_dev_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_dev_data:

