services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aymnedu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aymnedu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aymnedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aymnedu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aymnedu_internal

  # ── Redis (Cache & Session Rate Limiter) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aymnedu_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aymnedu_internal

  # ── FastAPI Backend (Production Python 3.12) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aymnedu_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aymnedu}:${POSTGRES_PASSWORD:-changeme_prod_secret}@db:5432/${POSTGRES_DB:-aymnedu}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in production}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aymnedu_internal
      - aymnedu_public

  # ── React Frontend (Production Nginx Static + API Proxy) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: aymnedu_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aymnedu_public

networks:
  aymnedu_internal:
    internal: true
  aymnedu_public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
