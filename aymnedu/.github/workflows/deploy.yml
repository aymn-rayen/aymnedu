name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── 1. Backend Verification & Tests ─────────────────────────────────────────
  backend-ci:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "aymnedu/backend/requirements*.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aymnedu/backend/requirements.txt -r aymnedu/backend/requirements-dev.txt

      - name: Validate Alembic Migrations
        env:
          SECRET_KEY: test-secret-key-for-ci-only-minimum-32-chars
          DATABASE_URL: sqlite:///test_ci_migrations.db
        run: |
          cd aymnedu/backend
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          SECRET_KEY: test-secret-key-for-ci-only-minimum-32-chars
          DATABASE_URL: sqlite:///:memory:
        run: |
          cd aymnedu/backend
          pytest -v tests

  # ── 2. Frontend Typecheck & Production Build ────────────────────────────────
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "aymnedu/frontend/package-lock.json"

      - name: Install Node Dependencies
        run: npm ci
        working-directory: aymnedu/frontend

      - name: TypeScript Type Checking
        run: npx tsc --noEmit
        working-directory: aymnedu/frontend

      - name: Production Vite Build
        run: npm run build
        working-directory: aymnedu/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

  # ── 3. Docker Production Containers Validation ──────────────────────────────
  docker-validation:
    name: Docker Images Build Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: aymnedu/backend
          file: aymnedu/backend/Dockerfile
          push: false
          tags: aymnedu-backend:ci-test

      - name: Build Frontend Production Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: aymnedu/frontend
          file: aymnedu/frontend/Dockerfile
          push: false
          tags: aymnedu-frontend:ci-test

  # ── 4. Production Deployment Trigger (on merge to main) ─────────────────────
  deploy:
    name: Production Deployment Trigger
    needs: [backend-ci, frontend-ci, docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Deployment Ready
        run: |
          echo "All CI checks, tests, and Docker builds passed successfully for commit ${{ github.sha }}."
          echo "Ready for production release."

      - name: Trigger Webhook Deploy (Render / VPS)
        if: env.DEPLOY_HOOK_URL != ''
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$DEPLOY_HOOK_URL"
